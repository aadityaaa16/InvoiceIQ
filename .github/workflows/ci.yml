name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run on the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Real Postgres and Redis, exactly like local development.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: invoiceiq
          POSTGRES_PASSWORD: invoiceiq
          POSTGRES_DB: invoiceiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U invoiceiq" --health-interval 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: invoiceiq
      JWT_SECRET_KEY: ci-only-secret-key-that-is-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install OCR system packages (so the real-Tesseract tests run too)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app
      - name: Migrations apply cleanly
        run: alembic upgrade head
      - name: Tests
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check + build
        run: npm run build

  docker:
    # Prove the production images build. (Pushing to a registry is in the deploy guide.)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t invoiceiq-backend ./backend
      - run: docker build -t invoiceiq-frontend ./frontend
