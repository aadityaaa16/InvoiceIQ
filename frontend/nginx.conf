server {
    listen 80;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths (e.g. /invoices/123) serve index.html and
    # React Router handles them in the browser.
    location / {
        try_files $uri /index.html;
    }

    # Hashed asset filenames change on every build, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
