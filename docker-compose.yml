# Local development infrastructure for InvoiceIQ.
#
#   docker compose up -d        start everything in the background
#   docker compose ps           show status and health
#   docker compose logs -f      follow logs
#   docker compose down         stop (data is kept in volumes)
#   docker compose down -v      stop AND delete all data
#
# Services: postgres (5432), redis (6379), seaweedfs S3 API (8333),
#           api (8000), worker, flower (5555)
#
# ${VARS} are read from the .env file next to this file.
# The frontend service is added in Phase 7.

services:
  postgres:
    # Pinned major version + small Alpine-based image. Never use :latest for a database —
    # an unexpected major upgrade can make existing data files unreadable.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"            # host:container — lets the API on your machine connect
    volumes:
      - postgres_data:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      # Other services can wait until Postgres actually accepts connections,
      # not just until the container has started.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Append-only file: Redis writes every change to disk, so queued Celery jobs
    # are not lost if the container restarts.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    # S3-compatible object storage (open source, Apache-2.0). The backend talks to it
    # with boto3 over the S3 API, so the same code works against AWS S3 or MinIO.
    # (We originally planned MinIO, but MinIO stopped publishing free Docker images in 2025.)
    image: chrislusf/seaweedfs:4.00
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    # SeaweedFS reads S3 credentials from a JSON file. We generate that file from
    # environment variables at startup so no secret is ever committed to the repo.
    # ($$ escapes $ so the container's shell, not docker compose, expands the variable.)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs
        printf '{"identities":[{"name":"admin","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /etc/seaweedfs/s3.json
        # -ip.bind=0.0.0.0: listen on all interfaces. By default SeaweedFS binds only to the
        # container's internal IP, which breaks the health check and Docker port forwarding.
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 \
          -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"            # S3 API (used by the backend and presigned URLs)
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off job: creates the invoices bucket once storage is healthy, then exits.
  # Uses the official AWS CLI, which also proves the S3 compatibility is real.
  # Keeping this in infrastructure means the API never needs rights to create buckets.
  storage-init:
    image: amazon/aws-cli:2.27.0
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket ${S3_BUCKET} 2>/dev/null \
          || aws --endpoint-url http://seaweedfs:8333 s3 mb s3://${S3_BUCKET}
        echo "bucket ${S3_BUCKET} ready"
    restart: "no"

  # ---------------------------------------------------------------------------
  # Application services (one image, built from backend/Dockerfile)
  # ---------------------------------------------------------------------------
  api:
    build: ./backend
    image: invoiceiq-backend
    restart: unless-stopped
    env_file: .env
    # Inside the Docker network, services reach each other by service name, not
    # localhost. `environment` overrides the localhost values from .env.
    environment: &internal-hosts
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: http://seaweedfs:8333
      # S3_PUBLIC_ENDPOINT_URL stays http://localhost:8333: presigned URLs are for the browser.
      WATCHFILES_FORCE_POLLING: "true"   # file-change events don't cross Windows bind mounts
    # Local dev convenience: apply migrations on start, auto-reload on code changes.
    # (In production, migrations run once as a separate release step, not per replica.)
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  worker:
    image: invoiceiq-backend
    restart: unless-stopped
    env_file: .env
    environment: *internal-hosts
    # concurrency=2: two invoices processed in parallel (OCR is CPU-heavy).
    # No auto-reload: restart after code changes with `docker compose restart worker`.
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2
    volumes:
      - ./backend/app:/app/app
    depends_on:
      api:
        condition: service_started   # api builds the shared image and runs migrations
      redis:
        condition: service_healthy

  flower:
    # Web dashboard for Celery: tasks, retries, failures, worker status.
    image: mher/flower:2.0.1
    restart: unless-stopped
    command: celery --broker=redis://redis:6379/1 flower --port=5555
    ports:
      - "5555:5555"                  # http://localhost:5555
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    # Node runs only inside Docker; nothing to install on the host.
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"                  # http://localhost:5173
    volumes:
      - ./frontend:/app
      # Keep node_modules inside the container (fast, and out of the Windows/OneDrive folder).
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  frontend_node_modules:
  postgres_data:
  redis_data:
  seaweedfs_data:
